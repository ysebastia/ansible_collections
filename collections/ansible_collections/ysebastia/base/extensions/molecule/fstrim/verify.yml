---
- name: Verify
  hosts: all
  tasks:
    - name: Read fstrim.timer status
      become: true
      ansible.builtin.systemd_service:
        name: fstrim.timer
      register: fstrim_timer
    - name: Check fstrim.timer is enabled
      ansible.builtin.assert:
        that:
          - fstrim_timer.status.UnitFileState == 'enabled'
