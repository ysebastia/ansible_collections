---
- name: Gather facts if ansible_facts.os_family is undefined
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - os_family
  when:
    - ansible_facts.os_family is undefined

- name: Configure unattended-upgrades on Debian
  when: ansible_facts.os_family == "Debian"
  block:
    - name: Ensure unattended-upgrades is installed
      become: true
      ansible.builtin.apt:
        name: unattended-upgrades

    - name: Configure APT periodic runs and unattended-upgrades
      become: true
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/apt/apt.conf.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - 20auto-upgrades
        - 52unattended-upgrades-local

    - name: Ensure APT timers are enabled
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
