---
- name: Facts
  ansible.builtin.include_tasks: "facts.yml"

- name: Configure by operating system
  ansible.builtin.include_tasks: "config_{{ ansible_facts.os_family | lower }}.yml"

- name: Configuration
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^{{ item.key }}\\s"
    # Unquoted YAML yes/no become booleans: map them back to sshd syntax.
    line: "{{ item.key }} {{ item.value | ternary('yes', 'no') if item.value is boolean else item.value }}"
    state: present
    validate: "sshd -t -f %s"
  loop: "{{ openssh_config_base | combine(openssh_config_overrides) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify:
    - Restart sshd
  tags: security
