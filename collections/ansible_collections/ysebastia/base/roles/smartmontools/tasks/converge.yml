---
- name: Gather facts if ansible_facts.os_family is undefined
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - os_family
  when:
    - ansible_facts.os_family is undefined

- name: Configure smartd on Red Hat
  when: ansible_facts.os_family == "RedHat"
  block:
    - name: Ensure SMARTMONTOOLS is installed
      become: true
      ansible.builtin.dnf:
        name: smartmontools

    - name: Configure smartd.conf
      become: true
      ansible.builtin.template:
        src: smartd.conf.j2
        dest: /etc/smartmontools/smartd.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart smartd

    - name: Ensure smartd is running and enabled at boot
      become: true
      ansible.builtin.systemd_service:
        name: smartd.service
        state: started
        enabled: true
