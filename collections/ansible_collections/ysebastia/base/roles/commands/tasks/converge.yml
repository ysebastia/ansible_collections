---
- name: Install packages by operating system
  ansible.builtin.include_tasks: "install_{{ ansible_facts.os_family | lower }}.yml"

- name: Stat commands.log
  ansible.builtin.stat:
    path: /var/log/commands.log
  register: commands_log
- name: Create commands.log
  become: true
  ansible.builtin.file:
    path: /var/log/commands.log
    state: touch
    owner: root
    group: root
    mode: "0644"
  when: not commands_log.stat.exists
# logrotate renames commands.log every week: an append-only (+a) file cannot
# be renamed, so the attribute is removed when present. The file module
# reports "-a" as a change on every run, hence the condition on stat.
- name: Remove append-only attribute from commands.log
  become: true
  ansible.builtin.file:
    path: /var/log/commands.log
    attributes: -a
  when: "'append' in (commands_log.stat.attributes | default([]))"
- name: Commands configuration
  become: true
  ansible.builtin.copy:
    src: "files/{{ item.src }}"
    dest: "{{ item.dst }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  with_items:
    - src: /etc/logrotate.d/commands
      dst: /etc/logrotate.d/commands
      owner: root
      mode: "0644"
    - src: /etc/profile.d/commands.sh
      dst: /etc/profile.d/commands.sh
      owner: root
      mode: "0644"
    - src: /etc/rsyslog.d/commands.conf
      dst: /etc/rsyslog.d/commands.conf
      owner: root
      mode: "0644"
  notify:
    - Restart rsyslog
- name: Logwatch
  ansible.builtin.include_tasks: logwatch.yml
