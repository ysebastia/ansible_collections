---
- name: Get user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ git_repositories_user.name }}"

- name: Set user home and group
  ansible.builtin.set_fact:
    git_repositories_home: "{{ ansible_facts.getent_passwd[git_repositories_user.name][4] }}"
    git_repositories_gid: "{{ ansible_facts.getent_passwd[git_repositories_user.name][2] }}"
    git_repositories_has_credentials: "{{ git_repositories_user.credentials | default([]) | length > 0 }}"
