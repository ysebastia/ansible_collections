---
ansible_action: converge
enable_backuppc_agent: false
backuppc_directory_backup: /var/lib/backuppc
backuppc_owner: "{{ ansible_user | default('root') }}"
backuppc_serverhost: "{{ inventory_hostname_short }}"
backuppc_supported_os: ["debian"]
backuppc_user: backuppc
backuppc_linux:
  - /etc
  - /root
# Per-share rsync exclusions ($Conf{BackupFilesExclude}): keys are share names
# (entries of backuppc_linux/backuppc_path), values are patterns relative to the
# share root, e.g. {"/opt/nfs/nextcloud": ["/appdata_*/preview"]}.
backuppc_exclude: {}
