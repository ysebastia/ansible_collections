---
- name: Ensure that LIBVIRT packages are installed
  become: true
  ansible.builtin.dnf:
    name:
      - guestfs-tools
      - libguestfs
      - libvirt
      - libvirt-daemon-kvm
      - python3-firewall
      - python3-libvirt
      - python3-lxml
      - qemu-kvm
      - virt-install

- name: Ensure that unused LIBVIRT packages are absent
  become: true
  ansible.builtin.dnf:
    name: "{{ kvm_libvirt_packages_absent }}"
    state: absent
  when: kvm_libvirt_packages_absent | length > 0
