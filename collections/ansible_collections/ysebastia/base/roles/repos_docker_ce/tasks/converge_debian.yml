---
- name: Ensure GPG and python3-debian (deb822_repository) are installed
  become: true
  ansible.builtin.apt:
    name:
      - gpg
      - python3-debian
- name: Set DPKG architecture
  ansible.builtin.set_fact:
    docker_ce_dpkg_arch: "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else ansible_facts.architecture }}"
# Ancien format une-ligne, remplace par le fichier deb822 (docker-ce.sources)
- name: Remove legacy docker-ce.list repository file
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker-ce.list
    state: absent
- name: Configure Docker-CE repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker-ce
    types: deb
    uris: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
    suites: "{{ ansible_facts.distribution_release | lower }}"
    components: stable
    architectures: "{{ docker_ce_dpkg_arch }}"
    signed_by: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
  environment:
    https_proxy: "{{ docker_ce_https_proxy | default('') }}"
