---
- name: Ensure GPG and python3-debian (deb822_repository) are installed
  become: true
  ansible.builtin.apt:
    name:
      - gpg
      - python3-debian
- name: Create temporary file for the signing key
  ansible.builtin.tempfile:
    state: file
    suffix: .asc
  register: microsoft_key_tmp
  changed_when: false
- name: Download Microsoft signing key
  ansible.builtin.get_url:
    url: "{{ microsoft_key_url }}"
    dest: "{{ microsoft_key_tmp.path }}"
    force: true
    mode: "0644"
  environment:
    https_proxy: "{{ microsoft_https_proxy | default('') }}"
  changed_when: false
- name: Read signing key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - "{{ microsoft_key_tmp.path }}"
  register: microsoft_key_colons
  changed_when: false
# The key is only installed once its fingerprint is verified.
- name: Verify signing key fingerprint
  ansible.builtin.assert:
    that:
      - microsoft_key_fingerprints == [microsoft_key_fingerprint]
    fail_msg: "Unexpected Microsoft key fingerprint: {{ microsoft_key_fingerprints }}"
  vars:
    microsoft_key_fingerprints: >-
      {{ microsoft_key_colons.stdout_lines | select('match', '^fpr:') | map('split', ':')
      | map(attribute=9) | list | unique }}
- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
- name: Install Microsoft signing key
  become: true
  ansible.builtin.copy:
    src: "{{ microsoft_key_tmp.path }}"
    dest: /etc/apt/keyrings/microsoft.asc
    remote_src: true
    owner: root
    group: root
    mode: "0644"
- name: Remove temporary signing key
  ansible.builtin.file:
    path: "{{ microsoft_key_tmp.path }}"
    state: absent
  changed_when: false
- name: Configure Visual Studio Code repository
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: "{{ microsoft_dpkg_arch[ansible_facts.architecture] | default(ansible_facts.architecture) }}"
    signed_by: /etc/apt/keyrings/microsoft.asc
  vars:
    microsoft_dpkg_arch:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
