---
- name: Get user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_client_user.name }}"

- name: Set user home and group
  ansible.builtin.set_fact:
    ssh_client_home: "{{ ansible_facts.getent_passwd[ssh_client_user.name][4] }}"
    ssh_client_gid: "{{ ansible_facts.getent_passwd[ssh_client_user.name][2] }}"

- name: Create SSH directory
  become: true
  ansible.builtin.file:
    path: "{{ ssh_client_home }}/.ssh"
    state: directory
    owner: "{{ ssh_client_user.name }}"
    group: "{{ ssh_client_gid }}"
    mode: "0700"

# Inserted at the top: ssh keeps the first value found, so an existing
# "Host *" block cannot override these directives.
- name: Configure SSH host entries
  become: true
  ansible.builtin.blockinfile:
    path: "{{ ssh_client_home }}/.ssh/config"
    create: true
    owner: "{{ ssh_client_user.name }}"
    group: "{{ ssh_client_gid }}"
    mode: "0600"
    insertbefore: BOF
    marker: "# {mark} ANSIBLE MANAGED ssh_client {{ item.host }}"
    state: "{{ item.state | default('present') }}"
    block: |
      Host {{ item.host }}
      {% for key, value in ssh_client_options.items() %}
          {{ key }} {{ value | ternary('yes', 'no') if value is boolean else value }}
      {% endfor %}
  vars:
    ssh_client_options: >-
      {{ {'HostName': item.hostname | default(''), 'User': item.user | default(''),
          'IdentityFile': item.identity_file | default('')}
         | dict2items | rejectattr('value', 'equalto', '') | items2dict
         | combine(ssh_client_default_options, item.options | default({})) }}
  loop: "{{ ssh_client_user.hosts | default([]) }}"
  loop_control:
    label: "{{ item.host }}"
