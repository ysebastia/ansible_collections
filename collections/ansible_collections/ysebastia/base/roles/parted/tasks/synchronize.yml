---
- name: Refuse to synchronize the root filesystem
  ansible.builtin.assert:
    that:
      - item.path | length > 0
      - item.path != '/'
    fail_msg: "parted: synchronize is not supported on '{{ item.path }}'"
- name: Mount filesystems
  become: true
  ansible.posix.mount:
    path: "/mnt"
    src: "{{ item.dev }}"
    fstype: "{{ item.fstype }}"
    state: mounted
- name: Synchronize data
  become: true
  ansible.posix.synchronize:
    src: "{{ item.path }}/"
    dest: /mnt/
    recursive: true
    delete: true
  delegate_to: "{{ inventory_hostname }}"
- name: Umount filesystems
  become: true
  ansible.posix.mount:
    path: "/mnt"
    state: absent
# Empty the folder instead of removing it: the mount point never disappears,
# and keeps its owner and mode, even if a later task fails.
- name: Empty folder
  become: true
  ansible.builtin.command:
    argv:
      - find
      - "{{ item.path }}"
      - -mindepth
      - "1"
      - -delete
  changed_when: true
- name: Set folder mode
  become: true
  ansible.builtin.file:
    state: directory
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  when: item.mode is defined
