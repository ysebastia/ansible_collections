---
- name: Ensure GPG and python3-debian (deb822_repository) are installed
  become: true
  ansible.builtin.apt:
    name:
      - gpg
      - python3-debian
# Ancien format une-ligne, remplace par le fichier deb822 (hashicorp.sources)
- name: Remove legacy hashicorp.list repository file
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent
- name: Configure Hashicorp repository
  become: true
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ hashicorp_release }}"
    components: main
    signed_by: https://apt.releases.hashicorp.com/gpg
  environment:
    https_proxy: "{{ hashicorp_https_proxy | default('') }}"
