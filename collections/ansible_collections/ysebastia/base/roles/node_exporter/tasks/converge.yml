---
- name: Install packages by operating system
  ansible.builtin.include_tasks: "install_{{ ansible_facts.os_family | lower }}.yml"

- name: Configure FIREWALLD if enable_base_firewalld is defined
  when: enable_base_firewalld | bool
  ansible.builtin.include_tasks: firewalld.yml

- name: Ensure node_exporter is running and enabled at boot
  become: true
  ansible.builtin.service:
    name: "{{ node_exporter_service }}"
    state: started
    enabled: true
